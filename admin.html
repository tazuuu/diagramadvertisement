<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add Work &mdash; Diagram Advertisement</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo-mark.png">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-wrap { max-width: 720px; margin: 0 auto; padding: 64px 24px 96px; }
  .admin-head { margin-bottom: 32px; }
  .admin-head h1 { margin: 8px 0 12px; }
  .admin-head p { color: #8a8a8a; max-width: 52ch; }
  .admin-preview { margin-top: 12px; border-radius: 8px; overflow: hidden; background: #141414; display: none; }
  .admin-preview img { display: block; width: 100%; height: auto; }
  .admin-preview.is-ready { display: block; }
  .admin-note { color: #8a8a8a; font-size: 13px; margin-top: 8px; }
  .form-ok { color: #4ade80; margin: 12px 0; }
</style>
</head>
<body>

<main id="main" class="admin-wrap">
  <div class="admin-head">
    <div class="label">INTERNAL</div>
    <h1 class="anton">Add a work</h1>
    <p>
      This publishes straight to the live portfolio. The image is shrunk in your
      browser before it uploads, then the site rebuilds &mdash; give it about a
      minute to appear on <a href="/portfolio">the portfolio page</a>.
    </p>
  </div>

  <form id="uploadForm" class="contact-form" novalidate>
    <div class="field">
      <label for="f-pass">Password</label>
      <input id="f-pass" name="password" type="password" required autocomplete="current-password">
    </div>

    <div class="field">
      <label for="f-image">Image</label>
      <input id="f-image" name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
      <div class="admin-note" id="imageNote">JPEG, PNG or WebP. Large photos are fine &mdash; they get resized.</div>
      <div class="admin-preview" id="preview"><img alt="Preview of the selected image"></div>
    </div>

    <div class="field">
      <label for="f-title">Title</label>
      <input id="f-title" name="title" required maxlength="80" placeholder="Nice Times Cafeteria">
    </div>

    <div class="field">
      <label for="f-sub">Description</label>
      <input id="f-sub" name="sub" required maxlength="120" placeholder="Facade signage &amp; lighting">
    </div>

    <div class="field">
      <label for="f-cat">Category</label>
      <select id="f-cat" name="cat" required>
        <option value="3D Signage">3D Signage</option>
        <option value="LED Wall">LED Wall</option>
        <option value="Vehicle Graphics">Vehicle Graphics</option>
        <option value="Vinyl Sticker">Vinyl Sticker</option>
        <option value="UV Printing">UV Printing</option>
        <option value="Engraving">Engraving</option>
        <option value="ID &amp; Loyalty Cards">ID &amp; Loyalty Cards</option>
        <option value="Event Management">Event Management</option>
        <option value="Event Promotion">Event Promotion</option>
      </select>
    </div>

    <div id="formError" class="form-error" role="alert" hidden></div>
    <div id="formOk" class="form-ok" role="status" hidden></div>
    <button type="submit" id="submitBtn">Publish work &#8594;</button>
  </form>
</main>

<script src="js/admin.js"></script>
</body>
</html>
